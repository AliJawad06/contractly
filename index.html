<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContractMe - Find Your Next Contract</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .header {
      background: white;
      border-radius: 16px;
      padding: 40px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .logo {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    
    .tagline {
      font-size: 18px;
      color: #4a5568;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    
    .cta-link {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 2px solid #667eea;
      transition: all 0.3s ease;
    }
    
    .cta-link:hover {
      color: #764ba2;
      border-bottom-color: #764ba2;
    }
    
    .grid-wrapper {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .grid-title {
      font-size: 24px;
      font-weight: 600;
      color: #2d3748;
    }
    
    .job-count {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }
    
    #gridContainer {
      height: 600px;
      width: 100%;
    }
    
    .ag-theme-alpine {
      --ag-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      --ag-border-radius: 8px;
      --ag-header-background-color: #f7fafc;
      --ag-odd-row-background-color: #ffffff;
      --ag-row-hover-color: #f7fafc;
    }
    
    .nested-box {
      background-color: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 12px;
      margin: 4px 0;
      font-size: 0.9em;
      line-height: 1.4em;
    }
    
    .subfield {
      padding: 4px 0;
      color: #4a5568;
    }
    
    .subfield b {
      color: #2d3748;
    }
    
    a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    
    a:hover {
      color: #764ba2;
    }
    
    @media (max-width: 768px) {
      .header {
        padding: 24px;
      }
      
      .logo {
        font-size: 24px;
      }
      
      .tagline {
        font-size: 16px;
      }
      
      .grid-wrapper {
        padding: 16px;
      }
      
      #gridContainer {
        height: 500px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">ContractMe</div>
      <p class="tagline">
        Your fast track to employment. We search 200+ contracting sites daily, saving you time and maximizing your opportunities. 
        Filling out <a href="https://forms.gle/g2NQKHpwNeLVAZjg6" class="cta-link">this form</a> gets you website updates and early testing of upcoming features like Job Alerts and Auto-Apply!
      </p>
    </div>
    
    <div class="grid-wrapper">
      <div class="grid-header">
        <div class="grid-title">Latest Contract Opportunities</div>
        <div class="job-count" id="jobCount">Loading...</div>
      </div>
      <div id="gridContainer" class="ag-theme-alpine"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.noStyle.js"></script>

  <script>
    const gridOptions = {
      columnDefs: [],
      rowData: [],
      sideBar: 'columns',
      defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        autoHeight: true,
        tooltipShowMode: "whenTruncated",
        menuTabs: ['generalMenuTab', 'columnsMenuTab'],

        cellRenderer: (params) => {
          const field = params.colDef.field;
          const value = params.value;

          if (value == null) return '';

          if (field === 'description' && typeof value === 'string') {
            const plain = value
              .replace(/<[^>]+>/g, '')
              .replace(/\s+/g, ' ')
              .trim();

            const preview = plain.length > 150 ? plain.slice(0, 150) + '…' : plain;
            return `<div title="${plain.replace(/"/g, '&quot;')}">${preview}</div>`;
          }

          if (field === 'url' && typeof value === 'string') {
            const safeUrl = value.startsWith('http') ? value : `https://${value}`;
            try {
              const urlObj = new URL(safeUrl);
              const domain = urlObj.hostname.replace(/^www\./, '');
              return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">🔗 ${domain}</a>`;
            } catch {
              return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">🔗 Visit Site</a>`;
            }
          }

          if (Array.isArray(value)) {
            return value.map(v => `<div class="subfield">${v}</div>`).join('');
          }

          if (typeof value === 'object') {
            const subfields = Object.entries(value)
              .map(([k, v]) => `<div class="subfield"><b>${k}:</b> ${v ?? ''}</div>`)
              .join('');
            return `<div class="nested-box">${subfields}</div>`;
          }

          return value;
        },
      },
    };

    const gridDiv = document.getElementById('gridContainer');
    const gridApi = agGrid.createGrid(gridDiv, gridOptions);

    const jsonlFilePath = './all_companies_job_details_last_15_days_20251023_194537_s';
    const n = 2;

    async function loadAllJobs() {
      let allJobs = [];
      
      try {
        for (let i = 0; i <= n; i++) {
          const filePath = `${jsonlFilePath}${i}.jsonl`;
          
          try {
            const res = await fetch(filePath);
            const text = await res.text();
            const lines = text.trim().split('\n');
            const jsonArray = lines
              .filter(line => line.trim())
              .map(line => JSON.parse(line));
            
            const transformedArray = jsonArray.map(r => 
              ({ 
                ...r, 
                posted: r.posted?.date_postedStr , 
                experience: r.experience?.experience , 
                start: r.start?.start_dateStr,
                end: r.end?.end_dateStr 
              })
            );
            
            allJobs = [...allJobs, ...transformedArray];
          } catch (err) {
            console.warn(`Could not load file ${i}:`, err);
          }
        }
        
        if (allJobs.length === 0) {
          console.warn('No job data loaded.');
          document.getElementById('jobCount').textContent = '0 Jobs';
          return;
        }
        
        const firstRow = allJobs[0];
        console.log(allJobs.length)
        const columnDefs = Object.keys(firstRow).map(key => ({
          headerName: key.charAt(0).toUpperCase() + key.slice(1),
          field: key,
          width: 150,
        }));
        document.getElementById('jobCount').textContent = `${allJobs.length} Jobs`;
        
        gridApi.setGridOption('columnDefs', columnDefs);
        gridApi.setGridOption('rowData', allJobs);
        
      } catch (err) {
        console.error('Error loading jobs:', err);
        document.getElementById('jobCount').textContent = 'Error';
      }
    }

    loadAllJobs();
  </script>
</body>
</html>
